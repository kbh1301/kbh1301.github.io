services:
  generate-pdf:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/work
    working_dir: /work
    environment:
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    command: node build-scripts/generate-pdf.js
